<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Lot of HTML tags</title>
</head>
<body>
    <h1>HTML Tags</h1>
    <h2>I'm melting</h2>
    <h3>melting</h3>
    <h4>melting</h4>
    <h5>melting</h5>
    <h6>melting<br>.........</h6>
    <hr><hr><hr>
    <blockquote>"...and dreamed of para, para, paragraphs"</blockquote>
    <p><em>- Coldplay Paradise</em></p>

</body>
</html>
