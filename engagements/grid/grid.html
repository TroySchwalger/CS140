    <main>
        <h1>Grid</h1>
        <div class="parent">
            <div class="card"><h2>Kid A</h2></div>
            <div class="card"><h2>Kid B</h2></div>
            <div class="card"><h2>Kid C</h2></div>
            <div class="card"><h2>Kid D</h2></div>
            <div class="card"><h2>Kid E</h2></div>
            <div class="card"><h2>Kid F</h2></div>
        </div>
        <ul>
            <li>CSS Grid makes a grid with rows and columns while Flex is only one or the other.</li>
            <li>The parent places the kids in a box but the order of the the kid is determined on where the kid is. </li>
        </ul>
