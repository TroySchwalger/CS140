<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
    <link rel="stylesheet" href="forms.css">
</head>
<body>
    <header>
        <h1>Sign Up</h1>
    </header>
    <nav>
        <a href="#">Home</a>
    </nav>
    <main>
        <h2>Fantastic freeform figs for four fizzy fruits</h2>
        <div id="message"></div>
        <form action="formprocessing.html" method="post" id="myForm">
            <fieldset>
                <legend>Information</legend>
                <div class="form-row">
                    <label for="fullname">Full Name</label>
                    <input id="fullname" type="text" name="fullname" placeholder="Full Name">
                </div>
                <div class="form-row">
                    <label for="email">Email</label>
                    <input id="email" type="email" name="email" placeholder="Email">
                </div>
                <div class="form-row">
                    <label for="password">Password</label>
                    <input id="password" type="password" name="password" placeholder="Password">
                </div>
                <div class="form-row">
                    <label for="bday">Birthday</label>
                    <input id="bday" type="date" name="bday">
                </div>
                <div class="form-row">
                    <label for="age">Age</label>
                    <input id="age" type="number" name="age">
                </div>
                <div class="form-row">
                    <label name="state">State</label>
                    <select name="state" id="state">
                        <option value="" disabled selected>--------</option>
                        <option value="HI">Hawaii</option>
                        <option value="CO">Colorado</option>
                        <option value="UT">Utah</option>
                    </select>
                </div>
                <div class="form-row">
                    <label for="correct">Is this correct?</label>
                    <input id="correct" type="checkbox" name="correct">
                </div>
                <div class="check-row">
                    <div class="spacer"></div>
                    <label><input type="radio" name="option" value="A">A</label>
                    <label><input type="radio" name="option" value="B">B</label>
                </div>
                <div class="form-row">
                    <label for="lastwords">Any Last Words? </label>
                    <textarea id="lastwords" name="extra"></textarea>
                </div>
                <div class="check-row">
                    <div class="spacer"></div>
                    <input type="submit">
                </div>
            </fieldset>
            <fieldset>
                <legend>About You</legend>
                <div class="check-row">
                    <div class="spacer">Dogs or Cats?</div>
                    <label><input type="radio" name="animals" value="dog">Dogs</label>
                    <label><input type="radio" name="animals" value="cat">Cats</label>
                </div>
            </fieldset>
        </form>
    </main>
    <footer>
        <p>&copy; Troy Schwalger</p>
    </footer>
    <script src="formprocessing.js"></script>
</body>
</html>
